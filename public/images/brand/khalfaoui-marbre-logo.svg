<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 240" width="1340" height="240" role="img" aria-label="KHALFAOUI MARBRE S.A.R.L">
  <title>KHALFAOUI MARBRE S.A.R.L</title>

  <defs>
    <linearGradient id="km-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43bd88"/>
      <stop offset="55%" stop-color="#1e9d6b"/>
      <stop offset="100%" stop-color="#0b4f39"/>
    </linearGradient>
  </defs>

  <!-- ══ Emblème circulaire ══ -->
  <circle cx="120" cy="120" r="112" fill="#0d1714"/>
  <circle cx="120" cy="120" r="112" fill="none" stroke="url(#km-ring)" stroke-width="9"/>
  <circle cx="120" cy="120" r="97" fill="none" stroke="#1e9d6b" stroke-width="2" opacity="0.45"/>

  <!-- Monogramme K -->
  <text x="40" y="158" font-family="Georgia, 'Times New Roman', Times, serif" font-size="88"
        font-weight="700" fill="#ffffff" textLength="56" lengthAdjust="spacingAndGlyphs">K</text>

  <!-- Colonnes de marbre séparant les deux initiales -->
  <rect x="104" y="103" width="9" height="55" fill="#ffffff"/>
  <rect x="117" y="80"  width="9" height="78" fill="#1e9d6b"/>
  <rect x="130" y="95"  width="9" height="63" fill="#ffffff"/>

  <!-- Monogramme M -->
  <text x="146" y="158" font-family="Georgia, 'Times New Roman', Times, serif" font-size="88"
        font-weight="700" fill="#ffffff" textLength="74" lengthAdjust="spacingAndGlyphs">M</text>

  <!-- ══ Signature typographique ══ -->
  <text x="290" y="140" font-family="Georgia, 'Times New Roman', Times, serif" font-size="86"
        font-weight="700" fill="#ffffff" letter-spacing="1"
        textLength="480" lengthAdjust="spacingAndGlyphs">KHALFAOUI</text>

  <!-- Silhouette de dalles, reprise de l'enseigne -->
  <rect x="790" y="86"  width="12" height="54" fill="#ffffff"/>
  <rect x="806" y="62"  width="12" height="78" fill="#1e9d6b"/>
  <rect x="822" y="76"  width="12" height="64" fill="#ffffff"/>
  <rect x="838" y="100" width="9"  height="40" fill="#1e9d6b"/>

  <text x="862" y="140" font-family="Georgia, 'Times New Roman', Times, serif" font-size="86"
        font-weight="700" fill="#ffffff" letter-spacing="1"
        textLength="360" lengthAdjust="spacingAndGlyphs">MARBRE</text>

  <text x="1232" y="140" font-family="Georgia, 'Times New Roman', Times, serif" font-size="30"
        font-weight="700" fill="#ffffff" opacity="0.9"
        textLength="72" lengthAdjust="spacingAndGlyphs">S.A.R.L</text>

  <!-- Double filet, comme sur l'enseigne -->
  <rect x="290" y="170" width="1014" height="4" fill="#1e9d6b"/>
  <rect x="290" y="180" width="1014" height="1.5" fill="#ffffff" opacity="0.55"/>
</svg>
